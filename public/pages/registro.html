<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro | Huellitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="/assets/css/estilo.css" rel="stylesheet">
</head>
<body>
 
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"></i> Huellitas Felices</a>
        </div>
    </nav>
 
    <div class="container" style="padding: 60px 0;">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
 
                <div class="text-center mb-4">
                    <div class="context-icon mx-auto mb-3">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h2 class="section-title">Únete a la manada</h2>
                    <p class="section-subtitle">Crea tu cuenta y empieza a cambiar vidas</p>
                    <div class="paw-divider">🐾 🐾 🐾</div>
                </div>
 
                <div class="caja">
 
                    <div id="alerta"></div>
 
                    <form id="formRegistro">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Nombre</label>
                                <input type="text" name="nombre" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Apellido</label>
                                <input type="text" name="apellido" class="form-control" required>
                            </div>
                        </div>
 
                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo electrónico</label>
                            <input type="email" name="correo" class="form-control" required>
                        </div>
 
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Teléfono</label>
                                <input type="text" name="telefono" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Contraseña</label>
                                <input type="password" name="contrasena" class="form-control" required>
                            </div>
                        </div>
 
                        <div class="mb-4">
                            <label class="form-label fw-bold">Dirección</label>
                            <input type="text" name="direccion" class="form-control">
                        </div>
 
                        <button type="submit" class="btn btn-adoptar-card">
                            <i class="bi bi-heart-fill"></i> Registrarme
                        </button>
                    </form>
 
                    <p class="text-center mt-4 mb-0">
                        ¿Ya tienes cuenta? <a href="/login" class="footer-link" style="color: var(--primary); font-weight: 700;">Inicia sesión aquí</a>
                    </p>
                </div>
 
            </div>
        </div>
    </div>
 
    <footer class="footer-bottom text-center">
        <p class="mb-0">&copy; <span id="anio"></span> Huellitas Felices. Todos los derechos reservados.</p>
    </footer>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/comun.js"></script>
    <script src="/assets/js/registro.js"></script>
</body>
</html>
