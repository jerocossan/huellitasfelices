<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Huellitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link href="/assets/css/estilo.css" rel="stylesheet">
</head>
<body>
 
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-paw me-2"></i>Huellitas Felices</a>
        </div>
    </nav>
 
    <main class="page-content">
        <div class="container" style="padding: 60px 0;">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
 
                    <div class="text-center mb-4">
                        <div class="context-icon mx-auto mb-3">
                            <i class="bi bi-box-arrow-in-right"></i>
                        </div>
                        <h2 class="section-title">¡Qué bueno verte!</h2>
                        <p class="section-subtitle">Inicia sesión para seguir ayudando</p>
                        <div class="paw-divider">🐾 🐾 🐾</div>
                    </div>
 
                    <div class="caja">
 
                        <div id="alerta"></div>

                        <div id="sesionActiva" class="alert alert-info d-none">Ya tienes una sesión activa como <strong id="sesionNombre"></strong>. <a href="/api/logout">Cerrar sesión</a></div>
                            <form id="formLogin">
                                <div class="mb-3">
                                    <label class="form-label fw-bold" for="loginCorreo">Correo electrónico</label>
                                    <input id="loginCorreo" type="email" name="correo" class="form-control" autocomplete="email" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-bold" for="loginContrasena">Contraseña</label>
                                    <input id="loginContrasena" type="password" name="contrasena" class="form-control" autocomplete="current-password" required>
                                </div>

                                <button type="submit" class="btn btn-adoptar-card">
                                    <i class="bi bi-paw"></i> Entrar
                                </button>
                            </form>
                        
 
                        <p class="text-center mt-4 mb-0">
                            ¿No tienes cuenta? <a href="/formularioregistro" style="color: var(--primary); font-weight: 700; text-decoration:none;">Regístrate aquí</a>
                        </p>
                    </div>
 
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/comun.js"></script>
    <script src="/assets/js/login.js"></script>
</body>
</html>
