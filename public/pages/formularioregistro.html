<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro | Huellitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap"
        rel="stylesheet">
    <link href="/assets/css/estilo.css" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/"></i> Huellitas Felices</a>
        </div>
    </nav>

    <div class="container" style="padding: 60px 0;">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div class="text-center mb-4">
                    <div class="context-icon mx-auto mb-3">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h2 class="section-title">Únete a la manada</h2>
                    <p class="section-subtitle">Crea tu cuenta y empieza a cambiar vidas</p>
                    <div class="paw-divider">🐾 🐾 🐾</div>
                </div>

                <div class="caja">

                    <div id="alerta"></div>

                    <form id="formRegistro">

                            <label class="form-label fw-bold mb-3">¿Eres adoptante o fundación?</label>

                            <div class="row g-3 mb-4">
                                <div class="col-6">
                                    <a href="/registro" class="opcion-tipo">
                                        <i class="bi bi-house-heart-fill"></i>
                                        <span>Adoptante</span>
                                        <small>Quiero darle un hogar a una mascota</small>
                                    </a>
                                </div>
                                <div class="col-6">
                                    <a href="/registro_fundacion" class="opcion-tipo">
                                        <i class="bi bi-building-fill"></i>
                                        <span>Fundación</span>
                                        <small>Quiero publicar mascotas en adopción</small>
                                    </a>
                                </div>
                            </div>

                    </form>

                    <p class="text-center mt-4 mb-0">
                        ¿Ya tienes cuenta? <a href="/login" class="footer-link"
                            style="color: var(--primary); font-weight: 700;">Inicia sesión aquí</a>
                    </p>
                </div>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/comun.js"></script>
    <script src="/assets/js/registro.js"></script>
</body>

</html>
